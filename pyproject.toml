[project]
name = "mcp-xtream"
version = "0.1.0"
description = "MCP server for Xtream Codes IPTV: TV guide search and catchup downloads"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Markey", email = "david@dmarkey.com" }]
requires-python = ">=3.13"
keywords = ["mcp", "model-context-protocol", "iptv", "xtream", "epg", "xmltv", "catchup", "jellyfin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "fastmcp>=4.1.1",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/dmarkey/mcp-xtream"
Repository = "https://github.com/dmarkey/mcp-xtream"
Issues = "https://github.com/dmarkey/mcp-xtream/issues"

[project.scripts]
mcp-xtream = "mcp_xtream:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
